<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Отправить слово — Малахитовое детство</title>
  <link rel="stylesheet" href="/style.css" />
  <script src="/socket.io/socket.io.js"></script>
</head>
<body>
  <div class="container">
    <div class="guest-wrap">
      <div class="brand">
        <img src="/logo.png" alt="Логотип" class="logo" />
        <p>© 2026 Дворец Молодёжи.</p>
      </div>

      <section class="card">
        <h1>Ваше слово</h1>
        <p class="subtitle">Введите слово и отправьте его ведущему.</p>

        <label for="codeInput">Код комнаты</label>
        <input
          type="text"
          id="codeInput"
          placeholder="6 цифр"
          maxlength="6"
          inputmode="numeric"
          autocomplete="off"
        />

        <label for="wordInput" style="margin-top:18px;">Слово</label>
        <input
          type="text"
          id="wordInput"
          placeholder="Например: солнце"
          maxlength="40"
          autocomplete="off"
        />

        <button id="sendBtn">Отправить</button>

        <div id="message" hidden></div>
      </section>

      <div class="footer">© Малахитовое детство</div>
    </div>
  </div>

  <script>
    const socket = io();

    const codeInput = document.getElementById('codeInput');
    const wordInput = document.getElementById('wordInput');
    const sendBtn = document.getElementById('sendBtn');
    const message = document.getElementById('message');

    // Подстановка кода из ?code=
    const params = new URLSearchParams(window.location.search);
    const urlCode = params.get('code');
    if (urlCode) {
      codeInput.value = urlCode.replace(/\D/g, '').slice(0, 6);
    }

    function showMessage(text, isError) {
      message.hidden = false;
      message.className = isError ? 'error' : 'success';
      message.textContent = text;
    }

    sendBtn.addEventListener('click', () => {
      const code = codeInput.value.replace(/\D/g, '').slice(0, 6);
      const word = wordInput.value.trim();

      if (code.length !== 6) {
        showMessage('Введите корректный 6-значный код комнаты.', true);
        codeInput.focus();
        return;
      }
      if (!word) {
        showMessage('Введите слово.', true);
        wordInput.focus();
        return;
      }

      socket.emit('submitWord', { code, word });
      showMessage('Слово «' + word + '» отправлено! 🎉', false);
      wordInput.value = '';
      wordInput.focus();
    });

    wordInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') sendBtn.click();
    });

    codeInput.addEventListener('input', () => {
      codeInput.value = codeInput.value.replace(/\D/g, '').slice(0, 6);
    });
  </script>
</body>
</html>
