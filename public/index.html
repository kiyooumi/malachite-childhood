<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Облако слов — Малахитовое детство</title>
  <link rel="stylesheet" href="/style.css" />
  <script src="/socket.io/socket.io.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
</head>
<body>
  <div class="container">
    <div class="brand">
      <img src="/Hn2xe3Og8RkR4-IUS2YgWDGYWWVZlAvb_WAISbJ48j1DgbCjbpwgjR_1em036F-FEValbLUpY89YvMmASllJtEn0.jpeg" alt="Малахитовое детство" class="logo" />
    </div>

    <!-- ЭКРАН НАСТРОЙКИ -->
    <section id="setupScreen" class="card">
      <h1>Облако слов</h1>
      <p class="subtitle">Задайте вопрос — гости отправят свои слова с телефонов.</p>

      <label for="questionInput">Вопрос для гостей</label>
      <input
        type="text"
        id="questionInput"
        placeholder="Например: Какое твоё любимое слово?"
        maxlength="120"
        autocomplete="off"
      />
      <button id="createBtn">Создать облако</button>
    </section>

    <!-- ЭКРАН КОМНАТЫ -->
    <section id="roomScreen" class="card room-card" hidden>
      <h2 class="room-title">Облако создано!</h2>

      <div class="room-layout">
        <!-- ЛЕВАЯ КОЛОНКА: код + QR -->
        <aside class="room-left">
          <div class="code-block">
            <div class="code-label">Код комнаты</div>
            <div class="code-value" id="codeValue">000000</div>
          </div>

          <div class="qr-block">
            <canvas id="qrCanvas"></canvas>
            <div class="qr-caption" id="qrLink"></div>
          </div>

          <div class="question-display" id="questionDisplay">Вопрос</div>
        </aside>

        <!-- ПРАВАЯ КОЛОНКА: облако слов -->
        <main class="room-right">
          <div class="cloud" id="cloud">
            <div class="empty-note" id="emptyNote">Ждём слова от гостей…</div>
          </div>
        </main>
      </div>
    </section>

    <div class="footer">© 2026 Дворец Молодёжи.</div>
  </div>

  <script>
    const socket = io();

    const setupScreen = document.getElementById('setupScreen');
    const roomScreen = document.getElementById('roomScreen');
    const questionInput = document.getElementById('questionInput');
    const createBtn = document.getElementById('createBtn');
    const codeValue = document.getElementById('codeValue');
    const questionDisplay = document.getElementById('questionDisplay');
    const qrCanvas = document.getElementById('qrCanvas');
    const qrLink = document.getElementById('qrLink');
    const cloud = document.getElementById('cloud');
    const emptyNote = document.getElementById('emptyNote');

    let currentCode = null;

    createBtn.addEventListener('click', () => {
      const question = questionInput.value.trim();
      if (!question) {
        questionInput.focus();
        return;
      }
      socket.emit('createCloud', question);
    });

    questionInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') createBtn.click();
    });

    socket.on('cloudCreated', ({ code, question }) => {
      currentCode = code;

      // Строго по ТЗ: переключение только через hidden
      setupScreen.hidden = true;
      roomScreen.hidden = false;

      codeValue.textContent = code;
      questionDisplay.textContent = question;

      const guestUrl = window.location.origin + '/guest?code=' + code;
      qrLink.textContent = guestUrl;

      QRCode.toCanvas(qrCanvas, guestUrl, {
        width: 220,
        margin: 1,
        color: {
          dark: '#0F4D3A',
          light: '#FFFFFF'
        }
      }, (err) => {
        if (err) console.error('QR error:', err);
      });
    });

    socket.on('cloudUpdate', ({ code, words }) => {
      if (code !== currentCode) return;
      renderCloud(words);
    });

    function renderCloud(words) {
      cloud.innerHTML = '';

      if (!words || words.length === 0) {
        const note = document.createElement('div');
        note.className = 'empty-note';
        note.textContent = 'Ждём слова от гостей…';
        cloud.appendChild(note);
        return;
      }

      words.forEach(({ word, count }) => {
        const span = document.createElement('span');
        span.className = 'word';
        span.textContent = word;
        span.style.fontSize = (16 + count * 8) + 'px';
        cloud.appendChild(span);
      });
    }
  </script>
</body>
</html>
